[project]
name = "cyberlaw-agent"
version = "0.1.0"
description = "Agentic RAG over Texas Penal Code Chapter 33 (Computer Crimes)"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "pinecone>=8.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
evals = ["ragas>=0.4", "datasets>=3.0", "pandas>=2.0"]
tracing = ["weave>=0.51"]
dev = ["pytest>=8.0"]

[project.scripts]
cyberlaw = "cyberlaw.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
